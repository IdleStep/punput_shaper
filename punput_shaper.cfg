# Punput Shaper is now a Klipper plugin. This file only keeps older printer.cfg files starting:
# they still include it and override _PUNPUT_SHAPER_VARS. Run install.sh once and restart Klipper.

[gcode_macro _PUNPUT_SHAPER_VARS]
gcode:

[delayed_gcode PUNPUT_SHAPER_UPGRADE_NOTICE]
initial_duration: 5
gcode:
  RESPOND PREFIX="⚠️" MSG="Punput Shaper is now a plugin. Run ~/printer_data/config/punput_shaper/install.sh once, then restart Klipper."
