# Punput Shaper: periodic jokes for the Klipper console. See README.md.
# Don't edit the defaults here; override them in printer.cfg instead.

[gcode_macro _PUNPUT_SHAPER_VARS]
variable_api: "local"               # icanhazdadjoke, official, norris, jokeapi, local
variable_loop_at_startup: True      # Start the loop when Klipper starts
variable_loop_duration: 900         # Seconds between jokes (900 = 15 minutes)
variable_loop_drift: 30             # Random +/- seconds added to each interval
variable_only_while_printing: True  # Only tell jokes while idle_timeout is "Printing"
gcode:

[gcode_macro PUNPUT_SHAPER]
description: Print one joke from the configured source
gcode:
  {% set cfg = printer["gcode_macro _PUNPUT_SHAPER_VARS"] %}
  RUN_SHELL_COMMAND CMD=punput_shaper PARAMS="{cfg.api | lower}"

[delayed_gcode PUNPUT_SHAPER_LOOP]
gcode:
  {% set cfg = printer["gcode_macro _PUNPUT_SHAPER_VARS"] %}
  {% set only_while_printing = cfg.only_while_printing | lower == 'true' %}
  {% set delay = [(cfg.loop_duration + range(-cfg.loop_drift, cfg.loop_drift + 1) | random) | int, 1] | max %}
  {% if not only_while_printing or printer.idle_timeout.state == "Printing" %}
    PUNPUT_SHAPER
  {% endif %}
  UPDATE_DELAYED_GCODE ID=PUNPUT_SHAPER_LOOP DURATION={delay}

[delayed_gcode PUNPUT_SHAPER_STARTUP]
initial_duration: 1
gcode:
  {% set cfg = printer["gcode_macro _PUNPUT_SHAPER_VARS"] %}
  {% if cfg.loop_at_startup | lower == 'true' %}
    UPDATE_DELAYED_GCODE ID=PUNPUT_SHAPER_LOOP DURATION={cfg.loop_duration}
    RESPOND PREFIX="😁" MSG="Punput Shaper: jokes every ~{cfg.loop_duration}s from '{cfg.api}' (only while printing: {cfg.only_while_printing})"
  {% else %}
    RESPOND PREFIX="⚠️" MSG="Punput Shaper: loop not started (loop_at_startup is {cfg.loop_at_startup})"
  {% endif %}

[gcode_shell_command punput_shaper]
command: python3 ../printer_data/config/punput_shaper/punput_shaper.py
timeout: 5
